name: Fetch DEM

# Manual run from the Actions tab: downloads the Copernicus GLO-30 crop
# over The Sphinx using the OpenTopography API key secret and commits it
# into data/sphinx/dem/. The dev box proxy blocks DEM hosts, so the
# runner is our network gateway.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Copernicus GLO-30 crop over The Sphinx
        id: download
        env:
          OPENTOPO_API_KEY: ${{ secrets.OPENTOPO_API_KEY }}
        run: |
          if [ -z "$OPENTOPO_API_KEY" ]; then
            echo "::error::secret OPENTOPO_API_KEY is missing or empty - tell the agent the exact secret name you used"
            exit 1
          fi
          mkdir -p data/sphinx/dem
          curl -sfL --retry 2 -o data/sphinx/dem/sphinx-cop30.tif \
            "https://portal.opentopography.org/API/globaldem?demtype=COP30&south=60.62&north=60.71&west=-145.15&east=-145.00&outputFormat=GTiff&API_Key=${OPENTOPO_API_KEY}"
          SIZE=$(stat -c%s data/sphinx/dem/sphinx-cop30.tif)
          MAGIC=$(head -c 4 data/sphinx/dem/sphinx-cop30.tif | od -An -tx1 | tr -d ' \n')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "magic=${MAGIC}" >> "$GITHUB_OUTPUT"
          [ "$SIZE" -gt 100000 ] || { echo "::error::DEM suspiciously small: ${SIZE} bytes (magic ${MAGIC})"; exit 1; }
          case "$MAGIC" in
            49492a00|4d4d002a) echo "TIFF verified (magic ${MAGIC}, ${SIZE} bytes)" ;;
            *) echo "::error::not a TIFF (magic ${MAGIC}, ${SIZE} bytes) - likely an API error; check the key"; exit 1 ;;
          esac

      - name: Report result
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "job=fetch-dem"
            echo "verdict=${{ job.status }}"
            echo "at=$(date -u +%FT%TZ)"
            echo "size=${{ steps.download.outputs.size }}"
            echo "magic=${{ steps.download.outputs.magic }}"
          } > .ci/dem-last-run.env
          git config user.name "dem-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A .ci data/sphinx/dem
          git commit -m "DEM fetch: ${{ job.status }} [skip ci]" || exit 0
          git pull --rebase origin master
          git push origin master
